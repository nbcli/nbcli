steps:

  - name: build
    image: python:3-alpine
    pull: true
    commands:
      - pip3 install setuptools wheel twine build
      - python3 -m build
      - twine check dist/*
    when:
      event: [push]

  - name: publish
    image: python:3-alpine
    environment:
      TWINE_USERNAME:
        from_secret: pypi_username
      TWINE_PASSWORD:
        from_secret: pypi_nbcli_token
    commands:
      - pip3 install setuptools wheel twine build
      - python3 -m build
      - twine check dist/*
      - twine upload dist/*
    when:
      event: tag
      ref: refs/tags/v*

when:
  branch: [ release, develop ]
  event: [ push, tag ]
